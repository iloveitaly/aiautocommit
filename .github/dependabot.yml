version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Stay on the floating v4 tag instead of patch pins like 4.2.4
      - dependency-name: "jdx/mise-action"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"