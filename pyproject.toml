[project]
name = "aiautocommit"
version = "0.20.0"
description = "AI generated commit messages"
keywords = ["git", "commit", "automation", "ai", "openai", "gemini", "anthropic"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "structlog-config>=0.6.0",
    "backoff>=2.2.1",
    "click>=8.1.7",
    "pydantic-ai-slim[anthropic,google,openai]>=2.19.0",
]
authors = [{ name = "Michael Bianco", email = "mike@mikebian.co" }]
urls = { "Repository" = "https://github.com/iloveitaly/aiautocommit" }

[project.optional-dependencies]
all-providers = [
    "pydantic-ai>=2.19.0",
]

# additional packaging information: https://packaging.python.org/en/latest/specifications/core-metadata/#license
[project.scripts]
aiautocommit = "aiautocommit:main"


[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
# avoids the src/ directory structure
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pyright[nodejs]>=1.1.408",
    "ruff>=0.15.0",
    "pudb>=2024.1.3",
    "beautiful-traceback>=0.5.0",
    "coverage>=7.13.4",
    "pytest-cov>=7.0.0",
    "covdefaults>=2.3.0",
]

[tool.pyright]
exclude = ["examples/", "playground/", "tmp/", ".venv/", "tests/"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing --cov-report=html:tmp/htmlcov"
norecursedirs = ["tmp", ".venv", "playground"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["aiautocommit"]

[tool.coverage.report]
fail_under = 50
