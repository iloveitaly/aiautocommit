[project]
name = "aiautocommit"
version = "0.28.0"
description = "AI generated commit messages"
keywords = ["git", "commit", "automation", "ai", "openai", "gemini", "anthropic"]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "structlog-config>=0.15.0",
    "backoff>=2.2.1",
    "click>=8.5.0",
    "pydantic-ai-slim[anthropic,google,openai]>=2.46.0",
]
authors = [{ name = "Michael Bianco", email = "mike@mikebian.co" }]
urls = { "Repository" = "https://github.com/iloveitaly/aiautocommit" }

[project.optional-dependencies]
all-providers = [
    "pydantic-ai>=2.46.0",
]

# additional packaging information: https://packaging.python.org/en/latest/specifications/core-metadata/#license
[project.scripts]
aiautocommit = "aiautocommit:main"


[build-system]
requires = ["uv_build>=0.11.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# avoids the src/ directory structure
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyright[nodejs]>=1.1.411",
    "ruff>=0.16.5",
    "pudb>=2025.1.5",
    "coverage>=7.16.0",
    "pytest-cov>=7.1.0",
    "covdefaults>=2.3.0",
    "beautiful-traceback>=1.0.2",
]

[tool.pyright]
exclude = ["examples/", "playground/", "tmp/", ".venv/", "tests/"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing --cov-report=html:tmp/htmlcov"
norecursedirs = ["tmp", ".venv", "playground"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["aiautocommit"]

[tool.coverage.report]
fail_under = 50
